<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Your First Sentences — Lesson 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6;
  --panel:#FFFFFF;
  --panel-2:#FFFDF8;
  --ink:#20243B;
  --ink-muted:#5B6178;
  --ink-dim:#9298AC;
  --subject:#FF4D6D;
  --subject-soft:#FFE1E7;
  --verb:#06B896;
  --verb-soft:#D8F7EE;
  --object:#FFB100;
  --object-soft:#FFF0CC;
  --blue:#3A86FF;
  --blue-soft:#E3ECFF;
  --violet:#8B5CF6;
  --line:#ECEAE2;
  --good:#1FBF75;
  --bad:#FF5C5C;
  --shadow:0 20px 50px -18px rgba(32,36,59,0.16);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;}
body{
  background-image:
    radial-gradient(circle at 8% 12%, rgba(255,77,109,0.10), transparent 40%),
    radial-gradient(circle at 92% 15%, rgba(6,184,150,0.12), transparent 40%),
    radial-gradient(circle at 50% 95%, rgba(255,177,0,0.12), transparent 40%);
}
::selection{background:var(--violet);color:#fff;}

#stage{position:relative;width:100%;height:100dvh;display:flex;align-items:center;justify-content:center;perspective:1400px;}
.slide{
  position:absolute;width:min(94vw,1040px);height:min(88vh,660px);
  background:linear-gradient(165deg,var(--panel),var(--panel-2));
  border:1px solid var(--line);border-radius:32px;box-shadow:var(--shadow);
  padding:clamp(22px,3.6vw,48px);display:flex;flex-direction:column;
  opacity:0;transform:translateX(60px) rotateY(-6deg) scale(0.96);
  transition:transform .55s cubic-bezier(.22,.9,.25,1), opacity .5s ease;
  pointer-events:none;overflow:hidden;
}
.slide.active{opacity:1;transform:translateX(0) rotateY(0) scale(1);pointer-events:auto;z-index:5;}
.slide.prev{opacity:0;transform:translateX(-60px) rotateY(6deg) scale(0.96);}

.eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-dim);display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--violet);}
h1.title{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(24px,3.6vw,38px);line-height:1.12;margin:0 0 6px 0;letter-spacing:-0.01em;color:var(--ink);}
.subtitle{color:var(--ink-muted);font-size:clamp(13px,1.4vw,16px);margin:0 0 16px 0;max-width:680px;line-height:1.5;}
.body-scroll{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:14px;overflow-y:auto;padding-right:4px;}
.body-scroll::-webkit-scrollbar{width:6px;}
.body-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

/* ---- signature SVO block ---- */
.block{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(15px,2.4vw,20px);padding:9px 18px;border-radius:14px;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;box-shadow:0 8px 18px -10px rgba(0,0,0,0.25);}
.block .tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.09em;font-weight:600;text-transform:uppercase;opacity:.8;}
.block.s{background:linear-gradient(145deg,var(--subject),#FF7A94);color:#fff;}
.block.v{background:linear-gradient(145deg,var(--verb),#22D6AC);color:#fff;}
.block.o{background:linear-gradient(145deg,var(--object),#FFC940);color:#472F00;}
.plus{color:var(--ink-dim);font-size:19px;font-weight:700;}

/* ---- cover ---- */
.cover-grid{flex:1;display:grid;grid-template-columns:1.05fr 0.95fr;gap:28px;align-items:center;min-height:0;}
.cover-left{display:flex;flex-direction:column;gap:16px;justify-content:center;}
.lesson-badge{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--violet);border:1px solid #E4DBFF;padding:6px 14px;border-radius:100px;background:#F4F0FF;width:fit-content;}
.cover-blocks{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;}
.cover-right{position:relative;height:100%;display:flex;align-items:center;justify-content:center;}
.photo-wrap{position:relative;width:100%;height:min(50vh,420px);border-radius:26px;overflow:hidden;box-shadow:0 24px 50px -18px rgba(32,36,59,0.35);}
.photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-blob{position:absolute;border-radius:50%;filter:blur(2px);z-index:-1;}
.blob1{width:120px;height:120px;background:var(--object-soft);top:-30px;left:-30px;}
.blob2{width:90px;height:90px;background:var(--verb-soft);bottom:-20px;right:-20px;}
.photo-tag{position:absolute;bottom:14px;left:14px;background:rgba(255,255,255,0.92);backdrop-filter:blur(6px);
  padding:8px 14px;border-radius:12px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;color:var(--ink);
  display:flex;align-items:center;gap:8px;box-shadow:0 8px 20px -10px rgba(0,0,0,0.3);}

/* ---- warmup ---- */
.warmup-grid{flex:1;display:grid;grid-template-columns:0.85fr 1.15fr;gap:24px;min-height:0;}
.warmup-img{border-radius:20px;overflow:hidden;box-shadow:0 16px 40px -16px rgba(32,36,59,0.3);height:100%;}
.warmup-img img{width:100%;height:100%;object-fit:cover;}
.qa-cards{display:flex;flex-direction:column;gap:9px;overflow-y:auto;padding-right:4px;}
.qcard{font-family:'Fredoka',sans-serif;font-weight:500;font-size:clamp(14px,1.7vw,17px);
  background:var(--blue-soft);border:1px solid #D6E3FF;border-radius:14px;padding:11px 16px;color:var(--ink);
  display:flex;align-items:center;gap:10px;}
.qcard .qn{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--blue);font-weight:700;flex-shrink:0;}

/* ---- vocab table ---- */
.vocab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.vocab-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;
  display:flex;align-items:center;gap:12px;box-shadow:0 6px 16px -10px rgba(32,36,59,0.15);}
.vocab-icon{font-size:26px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  background:var(--object-soft);border-radius:12px;flex-shrink:0;}
.vocab-text{display:flex;flex-direction:column;line-height:1.25;}
.vocab-en{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;color:var(--ink);}
.vocab-ar{font-size:12.5px;color:var(--ink-muted);}

/* ---- reading ---- */
.reading-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px 28px;
  font-family:'Fredoka',sans-serif;font-weight:500;font-size:clamp(15px,1.9vw,19px);line-height:1.75;color:var(--ink);
  box-shadow:0 10px 30px -18px rgba(32,36,59,0.2);}
.reading-card .hl{background:linear-gradient(180deg,transparent 60%, var(--object-soft) 60%);padding:0 2px;border-radius:3px;}

/* ---- reading questions ---- */
.rq-list{display:flex;flex-direction:column;gap:10px;}
.rq-item{font-family:'Fredoka',sans-serif;font-weight:500;font-size:clamp(15px,2vw,19px);
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 18px;
  display:flex;align-items:center;gap:12px;box-shadow:0 6px 16px -10px rgba(32,36,59,0.12);}
.rq-num{width:28px;height:28px;border-radius:50%;background:var(--subject-soft);color:var(--subject);
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ---- notice pattern ---- */
.pattern-list{display:flex;flex-direction:column;gap:10px;}
.pattern-item{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(17px,2.3vw,22px);
  padding:12px 18px;border-radius:14px;background:#F7F6F1;border:1px solid var(--line);}
.pattern-item span.s{color:var(--subject);}.pattern-item span.v{color:var(--verb);}.pattern-item span.o{color:var(--object);}
.reveal-box{margin-top:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.ghost-btn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;padding:10px 18px;border-radius:100px;
  border:1.5px dashed var(--violet);color:var(--violet);background:#F8F5FF;cursor:pointer;transition:.2s;}
.ghost-btn:hover{background:#F0EAFF;transform:translateY(-1px);}

/* ---- formula ---- */
.formula-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,3vw,32px);
  display:flex;flex-direction:column;gap:18px;align-items:flex-start;box-shadow:0 12px 30px -18px rgba(32,36,59,0.2);}
.formula-big{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.example-line{font-family:'Fredoka',sans-serif;font-weight:500;font-size:clamp(16px,2.2vw,21px);color:var(--ink-muted);}
.example-line b{color:var(--ink);font-weight:600;}

/* ---- vocab bank (3 columns) ---- */
.bank-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;flex:1;min-height:0;}
.bank-col{display:flex;flex-direction:column;gap:8px;min-height:0;}
.bank-head{display:flex;align-items:center;gap:8px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;margin-bottom:4px;}
.bank-swatch{width:10px;height:10px;border-radius:3px;}
.bank-chips{display:flex;flex-wrap:wrap;gap:6px;overflow-y:auto;padding-right:2px;}
.bchip{font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:12.5px;padding:7px 10px;border-radius:10px;
  display:inline-flex;align-items:center;gap:5px;}
.bchip.s{background:var(--subject-soft);color:#B8264A;}
.bchip.v{background:var(--verb-soft);color:#04785F;}
.bchip.o{background:var(--object-soft);color:#8A5A00;}

/* ---- exercise shell ---- */
.ex-progress{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-dim);margin-bottom:6px;}
.instr-badge{font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;color:var(--ink);
  background:#F7F6F1;border:1px solid var(--line);border-radius:100px;padding:8px 16px;display:inline-flex;
  align-items:center;gap:8px;width:fit-content;margin-bottom:12px;}

/* ---- chunk-click sentences ---- */
.chunk-sentence{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:'Fredoka',sans-serif;font-weight:500;
  font-size:clamp(15px,2vw,19px);box-shadow:0 6px 16px -10px rgba(32,36,59,0.12);transition:.25s;position:relative;}
.chunk-sentence.solved{border-color:var(--good);background:#F1FBF5;}
.chunk{padding:6px 12px;border-radius:9px;cursor:pointer;transition:.15s;border:1.5px solid transparent;color:var(--ink-muted);}
.chunk:hover{background:var(--blue-soft);color:var(--ink);}
.chunk.correct-pick{background:var(--verb);color:#fff;border-color:var(--verb);}
.chunk.wrong-pick{background:#FFE1E1;color:var(--bad);animation:shake .35s;}
.chunk.disabled{cursor:default;}
.chunk.punct{color:var(--ink-dim);cursor:default;padding:6px 2px;}
.check-badge{margin-left:auto;font-size:18px;opacity:0;transform:scale(0.6);transition:.3s;}
.chunk-sentence.solved .check-badge{opacity:1;transform:scale(1);}

/* ---- mcq ---- */
.mcq-block{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;
  box-shadow:0 6px 16px -10px rgba(32,36,59,0.12);}
.mcq-q{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(15px,2.1vw,19px);margin-bottom:10px;color:var(--ink);}
.mcq-q .blank{color:var(--violet);}
.mcq-options{display:flex;gap:10px;flex-wrap:wrap;}
.opt-btn{font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;
  border:1.5px solid var(--line);background:#FAFAF7;cursor:pointer;transition:.15s;color:var(--ink);}
.opt-btn:hover{border-color:var(--blue);background:var(--blue-soft);}
.opt-btn.correct{background:var(--verb-soft);border-color:var(--verb);color:#04785F;}
.opt-btn.wrong{background:#FFE1E1;border-color:var(--bad);color:var(--bad);animation:shake .35s;}
.opt-btn.disabled{pointer-events:none;opacity:.55;}

/* ---- true false ---- */
.tf-item{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  box-shadow:0 6px 16px -10px rgba(32,36,59,0.12);}
.tf-text{font-family:'Fredoka',sans-serif;font-weight:500;font-size:clamp(14px,1.9vw,17px);}
.tf-text .claim{color:var(--violet);font-weight:600;}
.tf-btns{display:flex;gap:8px;}
.tf-btn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;padding:8px 16px;border-radius:100px;
  border:1.5px solid var(--line);background:#FAFAF7;cursor:pointer;transition:.15s;}
.tf-btn.correct{background:var(--verb-soft);border-color:var(--verb);color:#04785F;}
.tf-btn.wrong{background:#FFE1E1;border-color:var(--bad);color:var(--bad);animation:shake .35s;}
.tf-btn.disabled{pointer-events:none;opacity:.5;}

/* ---- arrange ---- */
.arrange-block{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px 18px;
  box-shadow:0 6px 16px -10px rgba(32,36,59,0.12);}
.arrange-answer{min-height:46px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;gap:8px;
  flex-wrap:wrap;align-items:center;margin-bottom:10px;transition:.2s;}
.arrange-answer.correct{border-color:var(--good);border-style:solid;background:#F1FBF5;}
.arrange-answer.wrong{border-color:var(--bad);border-style:solid;animation:shake .35s;}
.arrange-source{display:flex;gap:8px;flex-wrap:wrap;}
.frag{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13.5px;padding:8px 13px;border-radius:9px;
  background:var(--object-soft);color:#7A4E00;cursor:pointer;border:1.5px solid transparent;transition:.15s;}
.frag:hover{transform:translateY(-2px);}
.frag.placed{background:var(--blue-soft);color:var(--blue);}
.frag.hidden-src{display:none;}

/* ---- table (static) ---- */
.svo-table{width:100%;border-collapse:separate;border-spacing:0 7px;}
.svo-table thead th{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  text-align:left;padding:0 12px 4px 12px;font-weight:700;}
.svo-table thead th.s{color:var(--subject);}.svo-table thead th.v{color:var(--verb);}.svo-table thead th.o{color:var(--object);}
.svo-table td{font-family:'Fredoka',sans-serif;font-weight:500;font-size:clamp(12px,1.5vw,15px);padding:9px 12px;
  background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.svo-table td:first-child{border-left:1px solid var(--line);border-radius:10px 0 0 10px;}
.svo-table td:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0;}

/* ---- freewrite ---- */
.fw-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.fw-num{width:26px;height:26px;border-radius:50%;background:var(--subject-soft);color:var(--subject);
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.fw-input{flex:1;font-family:'Fredoka',sans-serif;font-size:15px;font-weight:500;padding:11px 14px;
  border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);outline:none;transition:.2s;}
.fw-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);}

/* ---- select / label sentence ---- */
.label-row{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:10px;
  box-shadow:0 6px 16px -10px rgba(32,36,59,0.12);}
.label-sentence{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;margin-bottom:8px;color:var(--ink);}
.label-selects{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.label-selects select{font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:13px;padding:7px 8px;
  border-radius:9px;border:1.5px solid var(--line);background:#FAFAF7;color:var(--ink);}
.label-selects .lbl{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-dim);}
.check-row-btn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:12.5px;padding:6px 14px;border-radius:100px;
  background:var(--ink);color:#fff;border:none;cursor:pointer;}
.check-row-btn:hover{opacity:.85;}

/* ---- general action buttons ---- */
.action-btn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;padding:11px 22px;border-radius:100px;
  border:none;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--violet),#6D4CE8);
  box-shadow:0 10px 24px -12px rgba(139,92,246,0.6);transition:.2s;}
.action-btn:hover{transform:translateY(-2px);}
.action-btn:active{transform:translateY(0);}
.action-row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;}
.status-msg{font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;color:var(--good);}

/* ---- speaking challenge / card draw ---- */
.draw-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
.level-tabs{display:flex;gap:8px;}
.level-tab{font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;padding:8px 18px;border-radius:100px;
  border:1.5px solid var(--line);background:#FAFAF7;color:var(--ink-muted);cursor:pointer;transition:.2s;}
.level-tab:hover{border-color:var(--blue);}
.level-tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.draw-progress{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-dim);}
.draw-cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;min-height:110px;align-items:center;}
.draw-card{width:132px;height:104px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:16px;box-shadow:0 14px 30px -14px rgba(32,36,59,0.3);
  transform:rotateY(90deg);transition:transform .5s cubic-bezier(.34,1.56,.64,1);padding:6px 8px;text-align:center;}
.draw-card.flipped{transform:rotateY(0deg);}
.draw-card .tag2{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;}
.draw-card.s{background:linear-gradient(150deg,var(--subject),#FF7A94);color:#fff;}
.draw-card.v{background:linear-gradient(150deg,var(--verb),#22D6AC);color:#fff;}
.draw-card.o{background:linear-gradient(150deg,var(--object),#FFC940);color:#472F00;}
.draw-card.x{background:linear-gradient(150deg,var(--blue),#6AA5FF);color:#fff;}
.draw-reveal{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(14px,2vw,18px);color:var(--ink-muted);
  opacity:0;transform:translateY(6px);transition:.4s;min-height:26px;}
.draw-reveal.show{opacity:1;transform:translateY(0);}
.draw-reveal .s{color:var(--subject);}.draw-reveal .v{color:var(--verb);}.draw-reveal .o{color:var(--object);}.draw-reveal .x{color:var(--blue);}
.timer-ring{position:relative;width:90px;height:90px;}
.timer-ring svg{transform:rotate(-90deg);}
.timer-ring circle{fill:none;stroke-width:8;}
.timer-ring .bgc{stroke:var(--line);}
.timer-ring .fgc{stroke:var(--violet);stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Fredoka',sans-serif;font-weight:700;font-size:26px;color:var(--ink);}

/* ---- closing ---- */
.closing-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;}
.closing-checks{display:flex;flex-direction:column;gap:10px;}
.closing-check{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(16px,2.2vw,21px);display:flex;align-items:center;gap:12px;}
.closing-check .swatch{width:13px;height:13px;border-radius:4px;}
.closing-tag{font-family:'Fredoka',sans-serif;font-size:clamp(17px,2.6vw,24px);color:var(--ink-muted);font-weight:500;}
.closing-tag b{color:var(--ink);}

@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
@keyframes popIn{0%{transform:scale(0.5);opacity:0;}60%{transform:scale(1.15);opacity:1;}100%{transform:scale(1);}}

/* ---- confetti + smiley toast ---- */
.confetti-piece{position:fixed;top:0;left:0;width:8px;height:8px;pointer-events:none;z-index:999;border-radius:2px;}
.smiley-pop{position:fixed;pointer-events:none;z-index:1000;font-size:34px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1) forwards, floatUp 1.1s ease-in forwards;}
@keyframes floatUp{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(-50px);opacity:0;}}

/* ---- nav ---- */
#nav{position:fixed;inset:0;pointer-events:none;}
.nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;
  background:#fff;border:1px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;
  cursor:pointer;pointer-events:auto;transition:.2s;box-shadow:0 10px 24px -12px rgba(32,36,59,0.25);}
.nav-btn:hover{background:var(--blue-soft);transform:translateY(-50%) scale(1.06);}
.nav-btn.disabled{opacity:.25;pointer-events:none;}
#prevBtn{left:clamp(8px,2.6vw,34px);}#nextBtn{right:clamp(8px,2.6vw,34px);}
.nav-btn svg{width:19px;height:19px;}
#counter{position:fixed;top:22px;right:clamp(16px,3vw,40px);font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink-dim);pointer-events:none;}
#brand{position:fixed;top:22px;left:clamp(16px,3vw,40px);font-family:'Fredoka',sans-serif;font-weight:600;font-size:13.5px;
  color:var(--ink-dim);display:flex;align-items:center;gap:7px;pointer-events:none;}
#brand .sq{width:8px;height:8px;border-radius:2px;background:var(--subject);}
#dots{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;
  max-width:80vw;justify-content:center;}
.dot{width:6px;height:6px;border-radius:50%;background:#DEDCD2;cursor:pointer;transition:.25s;}
.dot.active{background:var(--violet);width:20px;border-radius:4px;}
#progressbar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--subject),var(--verb),var(--object));transition:width .4s ease;z-index:20;}

@media (max-width:760px){
  .cover-grid,.warmup-grid{grid-template-columns:1fr;}
  .cover-right{height:180px;}.photo-wrap{height:100%;}
  .vocab-grid{grid-template-columns:repeat(2,1fr);}
  .bank-grid{grid-template-columns:1fr;}
  .draw-cards{gap:10px;}
}
</style>
</head>

function iconFor(word){ return ICONS[word.toLowerCase().trim()] || '🔤'; }

/* ====================== FX: confetti + smiley ====================== */
const CONFETTI_COLORS = ['#FF4D6D','#06B896','#FFB100','#3A86FF','#8B5CF6'];
function burstConfetti(x,y,count=26){
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className='confetti-piece';
    p.style.left = x+'px'; p.style.top = y+'px';
    p.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
    const angle = Math.random()*Math.PI*2;
    const dist = 60 + Math.random()*140;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist - 40;
    const rot = (Math.random()*720-360);
    p.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:`translate(${dx}px, ${dy+220}px) rotate(${rot}deg)`, opacity:0}
    ], {duration: 900+Math.random()*500, easing:'cubic-bezier(.2,.7,.3,1)'});
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 1500);
  }
}
const SMILEYS = ['😄','🎉','⭐','😊','👏','🥳'];
function popSmiley(x,y){
  const s = document.createElement('div');
  s.className='smiley-pop';
  s.textContent = SMILEYS[Math.floor(Math.random()*SMILEYS.length)];
  s.style.left = (x-17)+'px'; s.style.top=(y-17)+'px';
  document.body.appendChild(s);
  setTimeout(()=>s.remove(), 1100);
}
function celebrateAt(el){
  const r = el.getBoundingClientRect();
  const x = r.left + r.width/2, y = r.top + r.height/2;
  burstConfetti(x,y);
  popSmiley(x, r.top);
}
function bigCelebrate(){
  const w = window.innerWidth;
  burstConfetti(w*0.25, window.innerHeight*0.3, 30);
  burstConfetti(w*0.5, window.innerHeight*0.25, 30);
  burstConfetti(w*0.75, window.innerHeight*0.3, 30);
}

/* ====================== helpers ====================== */
function svoText(parts){
  return parts.map(p=> p.t==='plain' ? `<span class="plain" style="color:var(--ink-muted)">${p.text}</span>` : `<span class="${p.t}">${p.text}</span>`).join(' ');
}
function block(letter,label){
  const cls = letter.toLowerCase();
  return `<span class="block ${cls}"><span class="tag">${label}</span>${letter}</span>`;
}
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

        <div class="qa-cards">${s.questions.map((q,i)=>`<div class="qcard"><span class="qn">Q${i+1}</span>${q}</div>`).join('')}</div>
      </div>`;

    case 'vocab': return `
      <div class="eyebrow"><span class="dot"></span>${s.eyebrow}</div>
      <h1 class="title">${s.title}</h1>
      <div class="body-scroll"><div class="vocab-grid">
        ${s.words.map(([en,ar])=>`<div class="vocab-card"><div class="vocab-icon">${iconFor(en)}</div>
          <div class="vocab-text"><span class="vocab-en">${en}</span><span class="vocab-ar">${ar}</span></div></div>`).join('')}
      </div></div>`;

    case 'reading': return `
      <div class="eyebrow"><span class="dot"></span>${s.eyebrow}</div>
      <h1 class="title">${s.title}</h1>
      <div class="body-scroll"><div class="reading-card">${s.text}</div></div>`;

    case 'rq': return `
      <div class="eyebrow"><span class="dot"></span>${s.eyebrow}</div>
      <h1 class="title">${s.title}</h1>
      <div class="body-scroll"><div class="rq-list">
        ${s.questions.map((q,i)=>`<div class="rq-item"><span class="rq-num">${i+1}</span>${q}</div>`).join('')}
      </div></div>`;

    case 'notice': return `
      <div class="eyebrow"><span class="dot"></span>${s.eyebrow}</div>
      <h1 class="title">${s.title}</h1>
      <div class="body-scroll">
        <div class="pattern-list">${s.lines.map(l=>`<div class="pattern-item">${svoText(l)}</div>`).join('')}</div>
        <div class="reveal-box">
          <button class="ghost-btn" id="revealPatternBtn">🔍 What comes first? Click to reveal</button>
          <span id="patternReveal" style="display:none;">${block('S','subject')}<span class="plus">→</span>${block('V','verb')}<span class="plus">→</span>${block('O','object')}</span>
        </div>
      </div>`;

    case 'formula': return `
      <div class="eyebrow"><span class="dot"></span>${s.eyebrow}</div>
      <h1 class="title">${s.title}</h1>
      <div class="body-scroll"><div class="formula-card">
        <div class="formula-big">${block('S','subject')}<span class="plus">+</span>${block('V','verb')}<span class="plus">+</span>${block('O','object')}</div>
        <div class="example-line">Example &mdash; <b>${svoText(s.example)}</b></div>
      </div></div>`;

    case 'bank': return `
      <div class="eyebrow"><span class="dot"></span>${s.eyebrow}</div>
      <h1 class="title">${s.title}</h1>
      <div class="bank-grid">
        <div class="bank-col"><div class="bank-head"><span class="bank-swatch" style="background:var(--subject)"></span>Subjects</div>
          <div class="bank-chips">${s.subjects.map(w=>`<span class="bchip s">${iconFor(w)} ${w}</span>`).join('')}</div></div>
        <div class="bank-col"><div class="bank-head"><span class="bank-swatch" style="background:var(--verb)"></span>Verbs</div>
          <div class="bank-chips">${s.verbs.map(w=>`<span class="bchip v">${iconFor(w)} ${w}</span>`).join('')}</div></div>
        <div class="bank-col"><div class="bank-head"><span class="bank-swatch" style="background:var(--object)"></span>Objects</div>
          <div class="bank-chips">${s.objects.map(w=>`<span class="bchip o">${iconFor(w)} ${w}</span>`).join('')}</div></div>
      </div>`;

    case 'chunk': return `
      <div class="eyebrow"><span class="dot"></span>${s.eyebrow}</div>
      <h1 class="title">${s.title}</h1>
      <div class="instr-badge">👆 ${s.instr}</div>
      <div class="body-scroll" data-chunk-container>
        ${s.items.map((it,i)=>`<div class="chunk-sentence" data-sentence="${i}">
            ${it.map((c,ci)=> c.t==='x' ? `<span class="chunk punct">${c.text}</span>` : `<span class="chunk" data-role="${c.t}" data-ci="${ci}">${c.text}</span>`).join('')}
            <span class="check-badge">✅</span>
          </div>`).join('')}
      </div>
      <div class="action-row"><span class="status-msg" data-status></span></div>`;

    case 'label': return `
      <div class="eyebrow"><span class="dot"></span>${s.eyebrow}</div>
      <h1 class="title">${s.title}</h1>
      <div class="instr-badge">🧩 ${s.instr}</div>
      <div class="body-scroll" data-label-container>
        ${s.items.map((it,i)=>`<div class="label-row" data-row="${i}">
          <div class="label-sentence">${it.chunks.join(' ')}.</div>
          <div class="label-selects">
            <span class="lbl">S</span><select data-role="s"></select>
            <span class="lbl">V</span><select data-role="v"></select>
            <span class="lbl">O</span><select data-role="o"></select>
            <button class="check-row-btn" data-check>Check</button>
            <span class="check-badge" style="opacity:1;transform:none;font-size:16px;"></span>
          </div>
        </div>`).join('')}
      </div>`;

    case 'mcq': return `
      <div class="eyebrow"><span class="dot"></span>${s.eyebrow}</div>
      <h1 class="title">${s.title}</h1>
      <div class="instr-badge">✅ ${s.instr}</div>
      <div class="body-scroll" data-mcq-container>
        ${s.items.map((it,i)=>`<div class="mcq-block" data-item="${i}">
          <div class="mcq-q">${it.q}</div>
          <div class="mcq-options">${it.options.map((o,oi)=>`<button class="opt-btn" data-oi="${oi}">${String.fromCharCode(97+oi)}) ${o}</button>`).join('')}</div>
        </div>`).join('')}
      </div>`;

    case 'truefalse': return `
      <div class="eyebrow"><span class="dot"></span>${s.eyebrow}</div>
      <h1 class="title">${s.title}</h1>
      <div class="instr-badge">🤔 ${s.instr}</div>
      <div class="body-scroll" data-tf-container>
        ${s.items.map((it,i)=>`<div class="tf-item" data-item="${i}">
          <div class="tf-text">${it.sentence} <span class="claim">${it.claim}</span></div>
          <div class="tf-btns"><button class="tf-btn" data-val="true">True</button><button class="tf-btn" data-val="false">False</button></div>
        </div>`).join('')}
      </div>`;

    case 'arrange': return `
      <div class="eyebrow"><span class="dot"></span>${s.eyebrow}</div>
      <h1 class="title">${s.title}</h1>
      <div class="instr-badge">🔀 ${s.instr}</div>
      <div class="body-scroll" data-arrange-container>
        ${s.items.map((it,i)=>`<div class="arrange-block" data-item="${i}">
          <div class="arrange-answer" data-answer></div>
          <div class="arrange-source" data-source></div>
        </div>`).join('')}
      </div>`;

    case 'table': return `
      <div class="eyebrow"><span class="dot"></span>${s.eyebrow}</div>
      <h1 class="title">${s.title}</h1>
      <p class="subtitle">${s.note}</p>
      <div class="body-scroll" style="overflow:auto;">
        <table class="svo-table"><thead><tr><th class="s">Subject</th><th class="v">Verb</th><th class="o">Object</th></tr></thead>
        <tbody>${s.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table>
      </div>`;

    case 'freewrite': return `
      <div class="eyebrow"><span class="dot"></span>${s.eyebrow}</div>
      <h1 class="title">${s.title}</h1>
      <div class="instr-badge">✍️ ${s.instr}</div>
      <div class="body-scroll" data-fw-container>
        ${[0,1,2,3,4].map(i=>`<div class="fw-row"><span class="fw-num">${i+1}</span>
          <input class="fw-input" type="text" placeholder="I ..." data-fw-input></div>`).join('')}
      </div>
      <div class="action-row"><button class="action-btn" data-fw-check>🎉 Check my sentences</button><span class="status-msg" data-status></span></div>`;

    case 'draw': return `
      <div class="eyebrow"><span class="dot"></span>${s.eyebrow}</div>
      <h1 class="title">${s.title}</h1>
      <div class="instr-badge">🎴 ${s.instr}</div>
      <div class="draw-wrap" data-draw-container>
        <div class="level-tabs">
          <button class="level-tab active" data-level="easy">🟢 ${s.levels.easy.label}</button>
          <button class="level-tab" data-level="hard">🔴 ${s.levels.hard.label}</button>
        </div>
        <div class="draw-progress" data-progress>Card 0 / ${s.levels.easy.items.length}</div>
        <div class="draw-cards" data-cards></div>
        <div class="timer-ring" data-timer style="visibility:hidden;">
          <svg width="90" height="90"><circle class="bgc" cx="45" cy="45" r="38"/><circle class="fgc" cx="45" cy="45" r="38" stroke-dasharray="238.7" stroke-dashoffset="0"/></svg>
          <div class="timer-num" data-timer-num>5</div>
        </div>
        <div class="draw-reveal" data-reveal></div>
        <button class="action-btn" data-draw-btn>🎴 Draw Cards</button>
      </div>`;

    case 'closing': return `
      <div class="closing-wrap">
        <div class="eyebrow"><span class="dot"></span>Recap</div>
        <h1 class="title">Every Strong English<br>Sentence Begins With</h1>
        <div class="closing-checks">
          <div class="closing-check"><span class="swatch" style="background:var(--subject)"></span> Subject</div>
          <div class="closing-check"><span class="swatch" style="background:var(--verb)"></span> Verb</div>
          <div class="closing-check"><span class="swatch" style="background:var(--object)"></span> Object</div>
        </div>
        <div class="closing-tag">Build the pattern. <b>Speak with confidence.</b> 🎉</div>
      </div>`;
  }
}

/* ====================== INTERACTIVE INIT ====================== */
function initSlide(slideEl, s){

  if(s.type === 'notice'){
    const btn = slideEl.querySelector('#revealPatternBtn');
    const reveal = slideEl.querySelector('#patternReveal');
    btn.addEventListener('click', ()=>{
      reveal.style.display='inline-flex';
      reveal.style.alignItems='center';
      reveal.style.gap='10px';
      btn.style.display='none';
      celebrateAt(reveal);
    });
  }

  if(s.type === 'chunk'){
    const sentences = slideEl.querySelectorAll('.chunk-sentence');
    sentences.forEach(sentEl=>{
      const chunks = sentEl.querySelectorAll('.chunk[data-role]');
      let solved = false;
      chunks.forEach(c=>{
        c.addEventListener('click', ()=>{
          if(solved) return;
          if(c.dataset.role === s.target){
            solved = true;
            chunks.forEach(cc=>cc.classList.add('disabled'));
            c.classList.add('correct-pick');
            sentEl.classList.add('solved');
            celebrateAt(c);
            checkAllSolved();
          } else {
            c.classList.add('wrong-pick');
            setTimeout(()=>c.classList.remove('wrong-pick'), 400);
          }
        });
      });
    });
    const statusEl = slideEl.querySelector('[data-status]');
    function checkAllSolved(){
      const allSolved = Array.from(sentences).every(el=>el.classList.contains('solved'));
      if(allSolved){
        statusEl.textContent = '🎉 Great job! All sentences solved!';
        bigCelebrate();
      }
    }
  }

  if(s.type === 'label'){
    const rows = slideEl.querySelectorAll('.label-row');
    rows.forEach((rowEl, idx)=>{
      const item = s.items[idx];
      const selects = rowEl.querySelectorAll('select');
      selects.forEach(sel=>{
        sel.innerHTML = `<option value="">--</option>` + shuffle(item.chunks).map(w=>`<option value="${w}">${w}</option>`).join('');
      });
      const btn = rowEl.querySelector('[data-check]');
      const badge = rowEl.querySelector('.check-badge');
      btn.addEventListener('click', ()=>{
        const sSel = rowEl.querySelector('select[data-role="s"]').value;
        const vSel = rowEl.querySelector('select[data-role="v"]').value;
        const oSel = rowEl.querySelector('select[data-role="o"]').value;
        const correctS = item.chunks[0], correctV = item.chunks[1], correctO = item.chunks[2];
        if(sSel===correctS && vSel===correctV && oSel===correctO){
          badge.textContent = '✅';
          rowEl.style.borderColor = 'var(--good)';
          celebrateAt(btn);
        } else {
          badge.textContent = '❌';
          rowEl.classList.add('wrong-pick-row');
          rowEl.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}], {duration:350});
        }
      });
    });
  }

  if(s.type === 'mcq'){
    const blocks = slideEl.querySelectorAll('.mcq-block');
    blocks.forEach((blockEl, idx)=>{
      const item = s.items[idx];
      const opts = blockEl.querySelectorAll('.opt-btn');
      opts.forEach((btn, oi)=>{
        btn.addEventListener('click', ()=>{
          if(oi === item.correct){
            btn.classList.add('correct');
            opts.forEach(o=>o.classList.add('disabled'));
            celebrateAt(btn);
          } else {
            btn.classList.add('wrong');
            setTimeout(()=>btn.classList.remove('wrong'), 400);
          }
        });
      });
    });
  }

  if(s.type === 'truefalse'){
    const items = slideEl.querySelectorAll('.tf-item');
    items.forEach((itemEl, idx)=>{
      const data = s.items[idx];
      const btns = itemEl.querySelectorAll('.tf-btn');
      btns.forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const val = btn.dataset.val === 'true';
          if(val === data.answer){
            btn.classList.add('correct');
            btns.forEach(b=>b.classList.add('disabled'));
            celebrateAt(btn);
          } else {
            btn.classList.add('wrong');
            setTimeout(()=>btn.classList.remove('wrong'), 400);
          }
        });
      });
    });
  }

  if(s.type === 'arrange'){
    const blocks = slideEl.querySelectorAll('.arrange-block');
    blocks.forEach((blockEl, idx)=>{
      const item = s.items[idx];
      const answerEl = blockEl.querySelector('[data-answer]');
      const sourceEl = blockEl.querySelector('[data-source]');
      let placed = [];

      function renderSource(){
        sourceEl.innerHTML = '';
        const shuffled = blockEl._order || (blockEl._order = shuffle(item.frags));
        shuffled.forEach((word)=>{
          const chip = document.createElement('span');
          chip.className = 'frag';
          chip.textContent = word;
          chip.dataset.word = word;
          if(placed.includes(word)) chip.classList.add('hidden-src');
          chip.addEventListener('click', ()=>{
            if(placed.includes(word)) return;
            placed.push(word);
            renderAnswer(); renderSource();
          });
          sourceEl.appendChild(chip);
        });
      }
      function renderAnswer(){
        answerEl.innerHTML = '';
        answerEl.classList.remove('correct','wrong');
        placed.forEach((word)=>{
          const chip = document.createElement('span');
          chip.className = 'frag placed';
          chip.textContent = word;
          chip.addEventListener('click', ()=>{
            const i = placed.lastIndexOf(word);
            if(i > -1) placed.splice(i,1);
            renderAnswer(); renderSource();
          });
          answerEl.appendChild(chip);
        });
        if(placed.length === item.frags.length){
          const isCorrect = placed.every((w,i)=> w.toLowerCase() === item.correct[i].toLowerCase());
          if(isCorrect){
            answerEl.classList.add('correct');
            celebrateAt(answerEl);
          } else {
            answerEl.classList.add('wrong');
            setTimeout(()=>{ placed = []; renderAnswer(); renderSource(); }, 700);
          }
        }
      }
      renderSource(); renderAnswer();
    });
  }

  if(s.type === 'freewrite'){
    const inputs = slideEl.querySelectorAll('[data-fw-input]');
    const btn = slideEl.querySelector('[data-fw-check]');
    const statusEl = slideEl.querySelector('[data-status]');
    btn.addEventListener('click', ()=>{
      const filled = Array.from(inputs).filter(i=>i.value.trim().length>0);
      if(filled.length===0){
        statusEl.style.color = 'var(--bad)';
        statusEl.textContent = 'اكتب جملة واحدة على الأقل ✍️';
        return;
      }
      statusEl.style.color = 'var(--good)';
      statusEl.textContent = filled.length===5 ? '🎉 Amazing! All 5 sentences done!' : `👏 Nice! ${filled.length}/5 sentences written.`;
      filled.forEach(inp=> celebrateAt(inp));
      if(filled.length===5) bigCelebrate();
    });
  }

  if(s.type === 'draw'){
    const btn = slideEl.querySelector('[data-draw-btn]');
    const cardsWrap = slideEl.querySelector('[data-cards]');
    const timerWrap = slideEl.querySelector('[data-timer]');
    const timerNum = slideEl.querySelector('[data-timer-num]');
    const fgCircle = slideEl.querySelector('.fgc');
    const progressEl = slideEl.querySelector('[data-progress]');
    const revealEl = slideEl.querySelector('[data-reveal]');
    const tabs = slideEl.querySelectorAll('.level-tab');
    const circumference = 238.7;
    const ROLE_LABEL = {s:'Subject', v:'Verb', o:'Object', x:'Detail'};

    let currentLevel = 'easy';
    let queue = [];
    let pointer = 0;
    let running = false;

    function newQueue(items){ return shuffle(items.map((_,i)=>i)); }
    function resetLevel(levelKey){
      currentLevel = levelKey;
      const items = s.levels[levelKey].items;
      queue = newQueue(items);
      pointer = 0;
      progressEl.textContent = `Card 0 / ${items.length}`;
      cardsWrap.innerHTML = '';
      revealEl.classList.remove('show');
      revealEl.textContent = '';
      timerWrap.style.visibility = 'hidden';
      tabs.forEach(t=> t.classList.toggle('active', t.dataset.level===levelKey));
    }

    tabs.forEach(tab=>{
      tab.addEventListener('click', ()=>{
        if(running || tab.dataset.level===currentLevel) return;
        resetLevel(tab.dataset.level);
      });
    });

    btn.addEventListener('click', ()=>{
      if(running) return;
      running = true;
      btn.disabled = true;
      revealEl.classList.remove('show');
      timerWrap.style.visibility='hidden';
      cardsWrap.innerHTML = '';

      const levelData = s.levels[currentLevel];
      const items = levelData.items;
      if(pointer >= queue.length){ queue = newQueue(items); pointer = 0; }
      const item = items[queue[pointer]];
      pointer++;
      progressEl.textContent = `Card ${pointer} / ${items.length}`;

      const roles = ['s','v','o'];
      if(item.x) roles.push('x');
      const shuffledRoles = shuffle(roles);

      shuffledRoles.forEach(role=>{
        const card = document.createElement('div');
        card.className = `draw-card ${role}`;
        card.innerHTML = `<span class="tag2">${ROLE_LABEL[role]}</span><span data-word>${item[role]}</span>`;
        cardsWrap.appendChild(card);
      });

      requestAnimationFrame(()=>{
        setTimeout(()=>{
          cardsWrap.querySelectorAll('.draw-card').forEach(c=>c.classList.add('flipped'));
        }, 60);
      });

      setTimeout(()=>{
        let t = levelData.seconds;
        timerWrap.style.visibility='visible';
        timerNum.textContent = t;
        fgCircle.style.strokeDashoffset = 0;
        const timerLoop = setInterval(()=>{
          t--;
          timerNum.textContent = Math.max(t,0);
          fgCircle.style.strokeDashoffset = circumference * ((levelData.seconds - t) / levelData.seconds);
          if(t<=0){
            clearInterval(timerLoop);
            bigCelebrate();
            timerNum.textContent = '🎉';
            const order = item.x ? ['s','v','o','x'] : ['s','v','o'];
            revealEl.innerHTML = 'Correct order: ' + order.map(r=>`<span class="${r}">${item[r]}</span>`).join(' ') + '.';
            revealEl.classList.add('show');
            btn.disabled = false;
            running = false;
          }
        }, 1000);
      }, 650);
    });

    resetLevel('easy');
  }
}

/* ====================== APP ====================== */
const stage = document.getElementById('stage');
const dotsEl = document.getElementById('dots');
const counterEl = document.getElementById('counter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progressbar = document.getElementById('progressbar');
let current = 0;
const total = slides.length;

slides.forEach((s,i)=>{
  const el = document.createElement('div');
  el.className = 'slide';
  el.dataset.idx = i;
  el.innerHTML = renderStatic(s);
  stage.appendChild(el);
  initSlide(el, s);

  const d = document.createElement('div');
  d.className = 'dot';
  d.addEventListener('click', ()=>goTo(i));
  dotsEl.appendChild(d);
});

const slideEls = Array.from(document.querySelectorAll('.slide'));
const dotEls = Array.from(document.querySelectorAll('.dot'));

function render(){
  slideEls.forEach((el,i)=>{
    el.classList.remove('active','prev');
    if(i===current) el.classList.add('active');
    else if(i<current) el.classList.add('prev');
  });
  dotEls.forEach((d,i)=> d.classList.toggle('active', i===current));
  counterEl.textContent = String(current+1).padStart(2,'0') + ' / ' + String(total).padStart(2,'0');
  prevBtn.classList.toggle('disabled', current===0);
  nextBtn.classList.toggle('disabled', current===total-1);
  progressbar.style.width = ((current+1)/total*100) + '%';
}
function goTo(i){ current = Math.max(0, Math.min(total-1, i)); render(); }
function next(){ goTo(current+1); }
function prev(){ goTo(current-1); }

prevBtn.addEventListener('click', prev);
nextBtn.addEventListener('click', next);
window.addEventListener('keydown', (e)=>{
  const tag = (e.target && e.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); next(); }
  if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); prev(); }
  if(e.key==='Home') goTo(0);
  if(e.key==='End') goTo(total-1);
});
let touchX = null;
stage.addEventListener('touchstart', e=> touchX = e.touches[0].clientX, {passive:true});
stage.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(dx > 60) prev(); else if(dx < -60) next();
  touchX = null;
}, {passive:true});

render();
</script>
